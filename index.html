<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Coach</title>
  <meta name="description" content="Pianificazione allenamenti con consigli automatici">
  <meta name="theme-color" content="#f6f5f2" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#121211" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Coach">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="top">
    <h1>Coach</h1>
    <span id="top-date"></span>
  </header>
  <main id="view"></main>
  <button class="fab" data-action="add" aria-label="Aggiungi attività">+</button>
  <nav class="tabs" aria-label="Sezioni">
    <button data-view="plan" class="on">Piano</button>
    <button data-view="stats">Statistiche</button>
    <button data-view="settings">Impostazioni</button>
  </nav>
  <div id="sheet" class="sheet" hidden>
    <div class="sheet-backdrop" data-action="close"></div>
    <div class="sheet-panel" role="dialog" aria-modal="true"></div>
  </div>
  <div id="toast" class="toast" hidden></div>
  <div id="tip" class="tip" hidden></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
